<!DOCTYPE html> <html lang="fr"> <head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Gestion des produits</title>

<link
    rel="stylesheet"
    href="/css/style.css"
>

</head> <body> <div class="container">

<!-- ========================================= -->
<!-- EN-TÊTE -->
<!-- ========================================= -->

<header>

    <h1>Gestion des produits</h1>

    <p class="subtitle">
        Sélectionnez le type de produit à gérer
    </p>

</header>


<!-- ========================================= -->
<!-- ÉTAPE 1 : CHOIX DU TYPE DE PRODUIT -->
<!-- ========================================= -->

<section
    id="product-selection"
    class="product-selection"
>

    <h2>
        Choisissez un type de produit
    </h2>


    <div class="product-types">


        <!-- ================================= -->
        <!-- LIVRE -->
        <!-- ================================= -->

        <button
            type="button"
            class="product-type"
            data-type="book"
        >

            <span class="product-icon">
                📚
            </span>

            <span class="product-name">
                Livre
            </span>

            <span class="product-description">
                Gérer les livres
            </span>

        </button>


        <!-- ================================= -->
        <!-- JEU VIDÉO -->
        <!-- ================================= -->

        <button
            type="button"
            class="product-type"
            data-type="video-game"
        >

            <span class="product-icon">
                🎮
            </span>

            <span class="product-name">
                Jeu vidéo
            </span>

            <span class="product-description">
                Gérer les jeux vidéo
            </span>

        </button>


        <!-- ================================= -->
        <!-- DVD -->
        <!-- ================================= -->

        <button
            type="button"
            class="product-type"
            data-type="dvd"
        >

            <span class="product-icon">
                🎬
            </span>

            <span class="product-name">
                DVD
            </span>

            <span class="product-description">
                Gérer les DVD
            </span>

        </button>


    </div>

</section>


<!-- ========================================= -->
<!-- PRODUIT SÉLECTIONNÉ -->
<!-- ========================================= -->

<section
    id="selected-product"
    class="selected-product hidden"
>

    <div class="selected-product-info">

        <span>
            Type de produit sélectionné :
        </span>

        <strong id="selected-product-name">
            -
        </strong>

    </div>


    <button
        type="button"
        id="change-product-button"
        class="change-product-button"
    >
        Changer de produit
    </button>

</section>


<!-- ========================================= -->
<!-- ÉTAPE 2 : CHOIX DE L'OPÉRATION CRUD -->
<!-- ========================================= -->

<section
    id="crud-section"
    class="crud-section hidden"
>

    <h2>
        Choisissez une opération
    </h2>

    <p class="section-description">
        Sélectionnez l'opération que vous souhaitez effectuer
        sur le produit.
    </p>


    <div class="crud-buttons">


        <!-- ================================= -->
        <!-- CREATE -->
        <!-- ================================= -->

        <button
            type="button"
            class="crud-button create-button"
            data-operation="create"
        >

            <span class="crud-icon">
                ＋
            </span>

            <span class="crud-name">
                Créer
            </span>

            <span class="crud-description">
                Ajouter un nouveau produit
            </span>

        </button>


        <!-- ================================= -->
        <!-- READ -->
        <!-- ================================= -->

        <button
            type="button"
            class="crud-button read-button"
            data-operation="read"
        >

            <span class="crud-icon">
                🔍
            </span>

            <span class="crud-name">
                Lire
            </span>

            <span class="crud-description">
                Consulter un produit
            </span>

        </button>


        <!-- ================================= -->
        <!-- UPDATE -->
        <!-- ================================= -->

        <button
            type="button"
            class="crud-button update-button"
            data-operation="update"
        >

            <span class="crud-icon">
                ✎
            </span>

            <span class="crud-name">
                Modifier
            </span>

            <span class="crud-description">
                Modifier un produit
            </span>

        </button>


        <!-- ================================= -->
        <!-- DELETE -->
        <!-- ================================= -->

        <button
            type="button"
            class="crud-button delete-button"
            data-operation="delete"
        >

            <span class="crud-icon">
                🗑
            </span>

            <span class="crud-name">
                Supprimer
            </span>

            <span class="crud-description">
                Supprimer un produit
            </span>

        </button>


    </div>

</section>


<!-- ========================================= -->
<!-- ZONE DES FORMULAIRES -->
<!-- ========================================= -->

<section
    id="operation-panel"
    class="operation-panel hidden"
>

    <!--
        Le formulaire correspondant à l'opération
        sélectionnée sera inséré ici par JavaScript.

        Exemple :

        - Création d'un livre
        - Lecture d'un jeu vidéo
        - Modification d'un DVD
        - Suppression d'un livre
    -->

</section>


<!-- ========================================= -->
<!-- ZONE DES RÉSULTATS -->
<!-- ========================================= -->

<section
    id="result-panel"
    class="result-panel hidden"
>

    <h2>
        Résultat
    </h2>


    <div
        id="result-content"
        class="result-content"
    >

        <!-- Les résultats de l'API seront affichés ici -->

    </div>

</section>

</div> <!-- ============================================= --> <!-- JAVASCRIPT --> <!-- ============================================= --> <script src="/js/app.js"></script> </body> </html>
